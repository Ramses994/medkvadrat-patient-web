name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Playwright 1.56.1 has no Chromium for Ubuntu 26; pin 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (tracked files)
        env:
          SCAN_DENYLIST: ${{ secrets.SCAN_DENYLIST }}
        run: node scripts/secret-scan.mjs

      - name: Secret scan (full git history)
        env:
          SCAN_DENYLIST: ${{ secrets.SCAN_DENYLIST }}
        run: node scripts/secret-scan.mjs --history

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_CLINIC_PHONE: '+7 900 000-00-00'

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Playwright
        run: npx playwright test
        env:
          CI: true

  image:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: patient-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Nginx contract tests
        run: |
          chmod +x scripts/nginx-image-test.sh
          IMAGE=patient-web:test ./scripts/nginx-image-test.sh

  # Push to GHCR only on main (same pattern as patient-api / max-bot).
  build-and-push:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger deploy workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/medkvadrat-deploy
          event-type: service-updated
          client-payload: |
            {
              "service": "${{ github.event.repository.name }}",
              "sha": "${{ github.sha }}",
              "actor": "${{ github.actor }}"
            }
